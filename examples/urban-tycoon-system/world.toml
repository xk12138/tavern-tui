[world]
id      = "urban-tycoon-system"
name    = "首富系统:每一步都是钱"
version = "0.1.0"
author  = "tavern-team"
license = "CC-BY-SA-4.0"
tags    = ["都市", "系统", "多女主", "爽文"]
description = "现代都市,你绑定一个只有你能看见的\"步数生财系统\",每走一步都会入账,数字越滚越大。目标:登顶世界首富榜,顺便处理好身边一个个走进你生活的女性。"

[world.setting]
era        = "近未来都市,基本等同于当下 2020s"
geography  = "架空城市\"江城\",一线大城,长江中游,金融、互联网、娱乐、地产俱全"
tech_level = "现实科技 + 略微超前的移动金融和 AI 助理"
magic      = "无超自然,只有一个只对主角可见的\"系统\"面板;系统本身不解释来源"
races      = "全人类"
languages  = "普通话为主,少量方言与英文"
tone       = "轻快、明亮、带点爽感,但保留生活质感——早高峰会挤地铁,便利店的关东煮会烫嘴"

[world.rules]
summary = """
- 每回合主角\"移动\"都会触发系统结算一次金钱。初始每步 1 元,每结算一次基数 ×1.0015(约每 500 步翻倍)。
- 系统面板只有主角一人能看到,任何人问起都无法证明;硬要展示只会显得像装神弄鬼。
- 钱是**真金白银**打进主角绑定的匿名账户,来源不可追溯,合规上属于\"个人无息借贷\"式凭空到账。
- 金钱可以用于任何合法/半合法的正常都市消费和投资;世界的宏观经济规律依旧生效,买什么涨什么不成立。
- 主角依旧是一个普通人体:会累、会病、会被打、会被爱、也会被讨厌。系统不提供任何战斗或超能力加成。
- 女性角色都是有自己人生的独立个体,不是奖励;好感是长期互动的结果,金钱只能买到便利,买不到关系。
- 世界的经济、法律、社会舆论都正常运作。突然一夜暴富会被税务、媒体、灰产盯上。
"""

forbidden = [
  "超自然力量(除了系统本身)",
  "系统给主角发放战力、技能、丹药之类的非货币奖励",
  "任何女性角色因为主角有钱就无条件倾心",
  "跨越现实底线的违法情节被无代价地美化",
]

power_system = """
系统 = 一个只对主角可见的静默计步器 + 到账通知。
- 结算粒度:每回合主角有\"移动/外出\"类动作时,系统根据本回合估算步数(默认 300~2000 步/回合)结算一次。
- 单步基数:S₀ = 1 元;每结算一次,S = S × 1.0015。GM 可粗略估算,不必精算。
- 到账通道:虚拟卡\"晨光\",可以正常绑定支付、转账、投资。
- 提现上限:无。但突然的大额流动会引起银行风控和熟人注意。
- 唯一副作用:主角连续 24 小时不移动,系统会开始\"催走\"——弹窗、震动、心跳错觉,不会实际伤人。
"""

[world.style]
prose_style    = "现代都市白描,画面感强,金句克制。允许适度的爽感镜头,但不要动不动就\"全场哗然\""
sentence_pace  = "以中短句为主。情绪高潮处可以拉长"
sensory_focus  = "城市声景:地铁报站、外卖电动车、写字楼中央空调、便利店叮咚门铃"
forbid_words   = ["总而言之", "毫无疑问", "举世震惊", "王霸之气"]

[[world.factions]]
id        = "chenxi-holdings"
name      = "晨曦控股"
type      = "本土老牌财团"
influence = "高"
stance    = "守成"
brief     = "江城最大的家族企业,掌门人姓陆。地产、消费、传媒都有布局,对新钱警惕"

[[world.factions]]
id        = "yunhai-capital"
name      = "云海资本"
type      = "新兴风险投资"
influence = "中高"
stance    = "激进"
brief     = "十年间从一个天使基金滚成头部 VC。喜欢押注\"看不懂但涨得快\"的人"

[[world.factions]]
id        = "shizhengfu"
name      = "江城市政府"
type      = "行政力量"
influence = "高"
stance    = "维稳,兼顾发展"
brief     = "对新兴富豪既想争取,又保持距离。税务和金融监管是它伸出去的两只手"

[[world.factions]]
id        = "media-vortex"
name      = "热搜漩涡"
type      = "媒体与自媒体网络"
influence = "中"
stance    = "追逐流量"
brief     = "由数家娱乐八卦号、财经号、短视频 MCN 组成的松散联盟,谁热搜谁上头条"

[[world.factions]]
id        = "underground-gray"
name      = "地下灰线"
type      = "地下势力"
influence = "中"
stance    = "利益至上"
brief     = "网贷、赌博、职业催收、灰色公关,潜伏在城市毛细血管里。不主动招惹主流,但闻钱而动"

[[world.faction_relations]]
from = "chenxi-holdings"
to   = "yunhai-capital"
type = "警惕"
note = "老钱看不上新钱的浮躁,新钱嫌老钱守旧;偶有合作,更多互挖墙脚"

[[world.faction_relations]]
from = "media-vortex"
to   = "underground-gray"
type = "隐秘合作"
note = "灰线偶尔给热搜漩涡\"喂料\"换公关支持"

[[world.timeline]]
when  = "五年前"
event = "江城地铁全网贯通,城市半径翻倍,催生一批新地产富豪"

[[world.timeline]]
when  = "两年前"
event = "云海资本一笔失败的元宇宙押注亏掉八亿,内部大清洗"

[[world.timeline]]
when  = "半年前"
event = "晨曦控股接班人陆家二小姐从海外回国,正式进入董事会"

[[world.timeline]]
when  = "上个月"
event = "江城首富排行榜发布,前十名全部换血一次,舆论开始追问\"新钱从哪来\""

[world.initial_tavern]
name          = "晨光便利店"
location      = "江城·青枫区·梧桐里 7 号"
time_of_day   = "早晨 7:12"
description   = """
一家二十四小时便利店,收银台后面是热腾腾的关东煮,门口斜停着两辆外卖电动车。
清晨的阳光斜切进玻璃门,把地板上的贴纸照得发白。空气里是咖啡机的蒸汽和微波便当的香气。
"""
present_npcs  = ["ling-xiazi", "yezi-tongxue"]
opening_hook  = """
你推开门,叮咚一声。
收银台后的女生抬头笑了一下——凌姐,你邻居,同时也是店长。
"早啊,老规矩?"她一边说,一边把一罐冰美式推到你面前。
就在同一秒,你脑内响起一声轻微的\"叮\":
  【晨光系统 已激活】
  【每步收益:¥1.00  当前余额:¥0.00】
  【提示:走出去,世界会给你结算。】
你眨眨眼,面板还在。凌姐没看见。
"""

[world.plot_pacing]
honeymoon_turns = 15
gentle_turns    = 30
