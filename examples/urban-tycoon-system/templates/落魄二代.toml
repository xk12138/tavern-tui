[template]
name    = "落魄二代"
tagline = "家道中落,还挂着少爷的名头,兜里已经是空的"

[template.pc]
background = """
你叫{{name}},今年二十六岁。
你父亲十年前是江城地产圈的一号人物,后来押错了一次商圈,资产被清算。
你从小读的国际学校、常春藤本科没读完就休学回国,现在挂着家里最后一家小公司的\"总经理\"头衔,其实公司账上只剩八万块。
你还住在老宅——一套快要抵押给银行的三层小楼。
今天早上,家里的老保姆让你自己下楼买早餐,你不情不愿地推开便利店的门——
然后系统来了。
"""
attribute_tags = ["熟悉上流社会规则", "英语流利", "身娇肉贵", "会看财报"]

[template.pc.attributes]
"金钱" = 8
"精神" = 14
"体力" = 6

[template.pc.hp]
current = 8
max     = 8

inventory         = ["一张即将透支的信用卡", "一块二手劳力士", "父亲留下的通讯录(纸质)", "半盒进口薄荷糖"]
starting_location = "晨光便利店"
