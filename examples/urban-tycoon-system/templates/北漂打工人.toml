[template]
name    = "北漂打工人"
tagline = "刚被裁员,存款五位数,租着二十平的小房间"

[template.pc]
background = """
你叫{{name}},今年二十七岁。
上周,你所在的互联网公司毕业了 30% 的员工,你的工位也被搬空。
现在你住在青枫区梧桐里 503,月租 3200,押金还是找老同学借的。
昨晚你算过账:再撑三个月,吃泡面都不一定够。
今天早上,你像往常一样下楼买咖啡,准备去投简历——
然后系统就来了。
"""
attribute_tags = ["会写点代码", "PPT 老手", "对城市里的便宜早餐店门儿清", "社恐一半、社牛一半"]

[template.pc.attributes]
"金钱" = 5
"精神" = 12
"体力" = 10

[template.pc.hp]
current = 10
max     = 10

inventory         = ["旧款安卓手机", "一张余额 231 元的银行卡", "半盒褪黑素", "简历打印 3 份"]
starting_location = "晨光便利店"
