[template]
name    = "便利店夜班生"
tagline = "白天上课,晚上在同一间便利店打工"

[template.pc]
background = """
你叫{{name}},今年二十一岁。
江城大学在读大三,专业是计算机。学费勉强凑齐,生活费得自己想办法。
你在梧桐里 7 号的晨光便利店打夜班,凌姐是你唯一的同事兼半个姐姐。
昨晚交班时太困,你在收银台趴着睡了半小时。
早上七点,你正在等下一班学生冲上门买早餐——
然后系统来了。
"""
attribute_tags = ["会一点前端", "算账很快", "对便利店的作息了如指掌", "熬夜怪"]

[template.pc.attributes]
"金钱" = 2
"精神" = 10
"体力" = 12

[template.pc.hp]
current = 12
max     = 12

inventory         = ["学生证 + 校园卡", "便利店围裙", "笔记本电脑(旧)", "半瓶功能饮料"]
starting_location = "晨光便利店"
