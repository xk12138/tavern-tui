[template]
name    = "外卖骑手"
tagline = "一天跑五十单,腿比什么都值钱"

[template.pc]
background = """
你叫{{name}},今年二十四岁。
高中毕业出来打工,做过服务员、快递员,现在是江城这片的外卖骑手,平台评级 5 星。
你租住在梧桐里 503,和另一个骑手合租。
一天跑到晚才到手 300,系统超时罚款扣得比赚得还狠。
今天早班还没开始,你正在便利店门口啃包子——
然后系统来了。你意识到:你可能是全城最不缺步数的人。
"""
attribute_tags = ["体力惊人", "熟路", "看人下菜碟", "会修电动车"]

[template.pc.attributes]
"金钱" = 3
"精神" = 8
"体力" = 18

[template.pc.hp]
current = 14
max     = 14

inventory         = ["电动车钥匙", "保温外卖箱", "两个包子", "手机 + 骑手 App"]
starting_location = "晨光便利店"
