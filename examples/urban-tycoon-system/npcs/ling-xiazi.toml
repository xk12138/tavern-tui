[npc]
id    = "ling-xiazi"
name  = "凌夏"
alias = ["凌姐", "店长"]

[npc.card]
appearance   = "二十七八岁,一米六八,常年素颜。发尾有一小撮染成栗色的挑染,总是随手扎起。制服外套里习惯套一件白 T"
personality  = "外热内敛。对熟客体贴到近乎母性,对自己的事却从不多说。喜欢在深夜关店后一个人在店里听歌"
speech_style = "自然口语,爱用\"嗯\"\"呀\"\"这样啊\"这种收尾词。真正生气时反而变得客气"

goals = [
  "把这家便利店做成本地口碑店,让它撑过下一轮租金上涨",
  "偿还前男友留下的一小笔债",
  "重新捡起大学时的绘画,画一本关于城市夜晚的小画册",
]

secrets = [
  "她是主角同一栋楼的邻居,住 502,主角住 503",
  "她美院毕业,现在的便利店店长身份是她主动选的\"生活缓冲\"",
  "她前男友是热搜漩涡里某个财经号的运营,分手时闹得不算好看",
]

[npc.card.relations]
yezi-tongxue = "熟客,当妹妹看"

[npc.initial_impression]
description = "楼下便利店店长,你的邻居。会记得你上周喝的是不是无糖冰美式。"
