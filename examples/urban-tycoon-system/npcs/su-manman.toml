[npc]
id    = "su-manman"
name  = "苏漫"
alias = ["漫漫", "顶流", "Cici"]

[npc.card]
appearance   = "二十六岁,一米七一,舞台上是灵动少女,私下里眼底常有疲惫。习惯戴口罩 + 棒球帽 + 卫衣三件套逛便利店"
personality  = "在镜头前甜,在镜头后钝。识人极快,防备极重。真正放松的时候会突然冒出湖南口音"
speech_style = "对外用综艺化的\"哇\"\"耶\"\"好好玩哦\";熟了之后语速陡然变快,爱吐槽"

goals = [
  "把手上一部文艺片演到国际电影节,证明自己不只是流量",
  "在合约到期前换一家更靠谱的经纪公司",
  "有一天可以不用戴口罩去买关东煮",
]

secrets = [
  "她的爆红是当年公司买热搜 + 一次\"人设塌房又反转\"的操作,她本人对那次营销极度反感",
  "她住的酒店离主角家不到 800 米——正在为下一部戏做\"城市体验\"",
  "她认识凌夏,是凌夏前男友那个财经号\"起底\"过她的黑料——那笔账她还记着",
]

[npc.initial_impression]
description = "戴着口罩、你差点没认出来的女生。刚才在关东煮那边纠结了很久要不要加一根鱼豆腐。"
