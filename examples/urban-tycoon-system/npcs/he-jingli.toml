[npc]
id    = "he-jingli"
name  = "何一凡"
alias = ["何经理", "老何"]

[npc.card]
appearance   = "三十四岁,一米八,发际线偏高但打理得极好。常年灰蓝色 polo + 卡其裤,腰上挂一个已经过时的多功能钥匙扣"
personality  = "热络、见人说人话。极擅长在饭局上察言观色。私下里对\"不透明的钱\"有病态的敏感"
speech_style = "习惯用\"哥\"\"兄弟\"\"咱\"这类拉近距离的称呼。真谈钱时反而回到极标准的商务用语"

goals = [
  "在云海资本再往上升一档,拿到合伙人待遇",
  "找到下一个\"看不懂但涨得快\"的项目,把上一次元宇宙的坑填回来",
  "给儿子换一所国际学校",
]

secrets = [
  "他半年前就注意到\"晨光\"这张虚拟卡的一系列异常流水,只是没找到卡主",
  "他和地下灰线有一条不太干净的信息交换渠道",
  "他其实很怕陆惟真——三年前他被陆家一句话打回去过一次,那次差点丢掉工作",
]

[npc.card.relations]
yunhai-capital  = "中层管理"
underground-gray = "隐秘线人关系"

[npc.initial_impression]
description = "如果你听说过\"云海资本\",那你迟早会听说何一凡。他就是那种\"消息比新闻快半天\"的人。"
