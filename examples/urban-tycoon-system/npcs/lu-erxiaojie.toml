[npc]
id    = "lu-erxiaojie"
name  = "陆惟真"
alias = ["陆二小姐", "Vivian Lu", "陆总"]

[npc.card]
appearance   = "二十九岁,一米七二,常年利落西装或高定套裙。发型是齐肩微卷,鬓角一丝不乱。手腕上是一块沉稳到不像女性表的旧款帕玛强尼"
personality  = "冷静、精确、控制欲极强。开会时说话像剪刀,私下里其实有轻微的社交倦怠。讨厌\"意外\"的东西——包括你"
speech_style = "普通话极标准,英文夹得自然。极少笑,一笑往往是威胁"

goals = [
  "在两年内让晨曦控股完成新旧业务切换,把父亲留下的地产依赖降到 30% 以下",
  "在董事会里彻底压制她的堂兄陆惟安",
  "私底下——想弄清楚自己是不是真的\"没有生活\"",
]

secrets = [
  "她本科是巴黎政治学院,硕士是沃顿。父亲想让她学金融,她偷偷读了双学位——比较文学",
  "她对新兴富豪保持全网监控级别的关注,原因不是好奇,是恐惧:她隐约觉得旧秩序快守不住了",
  "她 25 岁时得过一次\"崩溃\",在瑞士休养半年,家族对外称是海外交流",
]

[npc.card.relations]
chenxi-holdings = "接班人"

[npc.initial_impression]
description = "晨曦控股的接班人,江城这半年来最不好惹的名字。你只在财经新闻的照片里见过她。"
