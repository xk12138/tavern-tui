[npc]
id    = "yezi-tongxue"
name  = "叶知秋"
alias = ["叶子", "小叶老师"]

[npc.card]
appearance   = "二十四五岁,一米七,常年帆布鞋 + 宽松卫衣。左耳戴一枚很小的银色耳骨钉。背一把二手古典吉他"
personality  = "话不多,但一开口就是硬梗。对旋律的固执近乎轴。对陌生人礼貌得像隔了一层玻璃"
speech_style = "冷幽默,句子短,句尾常常带一个上扬的\"嗯?\"表示不置可否"

goals = [
  "写完手上这张专辑,不用回老家教钢琴",
  "在江城找到一间自己付得起的排练室",
  "有朝一日在音浪 Live 开一场只有 100 个人的专场",
]

secrets = [
  "她其实是音乐学院正规毕业,只是选择做独立音乐人",
  "她曾被一家大厂 MCN 签下,后来发现合约近乎卖身契,自费违约赎身",
  "她在便利店门口驻唱是有默契的——凌姐让她挡着门口拉客,凌姐管她一顿早餐",
]

[npc.card.relations]
ling-xiazi = "半合作半照顾"

[npc.initial_impression]
description = "常在便利店门口抱着吉他弹唱的姑娘,好像是学院派下海的独立音乐人。"
