[location]
id   = "wutongli"
name = "梧桐里"
type = "城市街区"

[location.description]
brief   = "青枫区的一条老街,住宅 + 小店混合,烟火气重"
details = """
南北走向,长约六百米,两侧种满梧桐,盛夏时能把整条街遮成绿色隧道。
街口是一间二十四小时的\"晨光便利店\",往南依次是老式菜市场、修电动车的杂铺、连锁咖啡、
新开的宠物友好餐厅,再往南接主干道\"青枫大道\"。
街区居民以年轻租户为主,租金比市中心便宜三成,但一到早晚高峰,楼下往往堵满外卖电动车。
晚上十一点后街道会安静下来,只有便利店和最南头一家 24 小时的自习室还亮着灯。
"""

[location.notable_places]
chenguang-store   = "晨光便利店(初始酒馆)"
wutong-503        = "梧桐里 7 号 503(主角出租屋)"
wutong-502        = "梧桐里 7 号 502(凌夏出租屋)"
yinlang-live      = "音浪 Live House(向南两个路口)"
qingfeng-station  = "地铁 3 号线·青枫站(街口)"
