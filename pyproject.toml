[project]
name = "tavern"
version = "0.8.0"
description = "A CLI-native, LLM-driven immersive interactive narrative engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Tavern Contributors" }]
keywords = ["interactive-fiction", "llm", "narrative", "tui", "cli"]

# Runtime deps: stdlib only for now.
# LLM providers / textual / chromadb are added in later milestones.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
tavern = "tavern.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tavern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
pythonpath = ["src"]
